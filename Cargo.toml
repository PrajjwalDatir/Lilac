[workspace]
resolver = "2"
members = [
    "crates/chess-core",
    "crates/lilac-proto",
    "crates/client-core",
    "crates/server-backend",
    "crates/tui-client",
    "crates/wasm-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Lilac Contributors"]

[workspace.dependencies]
# Core & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

# Chess Engine (Wasm-compatible)
shakmaty = "0.27"

# Async & Server
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# Auth
argon2 = "0.5"
jsonwebtoken = "9.3"
rand_core = "0.6"

# TUI Client
ratatui = "0.29"
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm"] }
resvg = { version = "0.50", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
crossterm = "0.28"
tokio-tungstenite = "0.29"

# Wasm Client
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Internal Workspace Crates
chess-core = { path = "crates/chess-core" }
lilac-proto = { path = "crates/lilac-proto" }
client-core = { path = "crates/client-core" }
